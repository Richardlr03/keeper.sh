name: keeper-local

services:
  keeper:
    image: ghcr.io/ridafkih/keeper-standalone:2
    container_name: keeper-local
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8787:80"
    volumes:
      - keeper-local-data:/var/lib/postgresql/data

volumes:
  keeper-local-data:
